# ───────────────────────────────────────────────────────────
# Dockur Windows Server 2022 + Windows 11 via macvlan
# Épisode « l'agent crée un domaine AD via MCP »
# ───────────────────────────────────────────────────────────

services:
  srv-dc:
    image: dockurr/windows
    container_name: srv-dc
    environment:
      VERSION: "2022"
      LANGUAGE: "French"
      REGION: "fr-FR"
      KEYBOARD: "fr"
      USERNAME: "Admin"
      PASSWORD: "MCPdemo2024!"
      RAM_SIZE: "8G"
      CPU_CORES: "4"
      DISK_SIZE: "80G"
      # Réseau statique via Dockur (la VM configure sa propre IP)
      DHCP: "N"
      IP: "192.168.10.241"
      GATEWAY: "192.168.10.254"
      DNS: "192.168.10.254"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    volumes:
      - /vm-gold/dockur/srv-dc:/storage
      - ./oem-srv-dc:/oem              # install.bat exécuté post-install
    restart: always
    stop_grace_period: 2m

  cli-01:
    image: dockurr/windows
    container_name: cli-01
    environment:
      VERSION: "11"
      LANGUAGE: "French"
      REGION: "fr-FR"
      KEYBOARD: "fr"
      USERNAME: "User01"
      PASSWORD: "MCPdemo2024!"
      RAM_SIZE: "4G"
      CPU_CORES: "2"
      DISK_SIZE: "64G"
      DHCP: "N"
      IP: "192.168.10.242"
      GATEWAY: "192.168.10.254"
      DNS: "192.168.10.241"             # pointe vers le DC (DNS du domaine)
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    volumes:
      - /vm-gold/dockur/cli-01:/storage
    restart: always
    stop_grace_period: 2m

networks:
  default:
    driver: macvlan
    driver_opts:
      parent: br0                     # interface bridge sur ubu1
    ipam:
      config:
        - subnet: 192.168.10.0/24
          gateway: 192.168.10.254
          ip_range: 192.168.10.240/28